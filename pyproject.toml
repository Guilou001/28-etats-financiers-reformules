[project]
name = "efr"
version = "1.0.0"
description = "La rentabilité des entreprises canadiennes vient-elle de l'exploitation ou de l'emprunt ? La reformulation de Nissim et Penman sur le bilan trimestriel de Statistique Canada"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guillaume Vaudescal" }]
dependencies = [
    "gvf[figures]>=0.2.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "truststore>=0.9",
    "typer>=0.12",
]

[project.scripts]
efr = "efr.cli:app"

[project.urls]
Homepage = "https://github.com/Guilou001/28-etats-financiers-reformules"

[tool.uv.sources]
gvf = { git = "https://github.com/Guilou001/gv-fintools", tag = "v0.2.1" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efr"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
